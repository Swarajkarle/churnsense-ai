[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# This URL is overridden by env.py which reads from SYNC_DATABASE_URL env var.
# It must be a sync driver (psycopg2), NOT asyncpg.
sqlalchemy.url = postgresql://churnsense_user:churnsense_pass@localhost:5432/churnsense

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = [sys.stderr]
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
